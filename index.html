<!DOCTYPE html>
<html>
<head>
<title>For You 💖</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff0f5;
  font-family:'Georgia', serif;
  overflow:hidden;
}

/* Start Screen */
#startScreen {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff0f5;
  color:#ff6f91;
  font-size:22px;
  cursor:pointer;
}

/* Message box */
#box {
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  max-width:500px;
  width:80%;
  text-align:center;
  display:none;
}

/* Text */
#text {
  font-size:17px;
  line-height:1.7;
  white-space:pre-line;
  color:#444;
}

/* Cursor */
.cursor {
  display:inline-block;
  width:8px;
  background:#ff6f91;
  animation:blink 1s infinite;
}

@keyframes blink {
  50% { background:transparent; }
}

/* Button */
button {
  margin-top:20px;
  padding:10px 20px;
  border:none;
  background:#ff6f91;
  color:white;
  border-radius:25px;
  cursor:pointer;
  font-size:14px;
}

/* Surprise */
#surprise {
  margin-top:20px;
  font-size:18px;
  color:#ff4d6d;
  display:none;
}

/* Floating hearts */
.heart {
  position:absolute;
  color:#ff9eb5;
  font-size:18px;
  animation:float 5s linear infinite;
}

@keyframes float {
  from { transform:translateY(0); opacity:1; }
  to { transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<div id="startScreen" onclick="start()">💖 Tap to open</div>

<div id="box">
  <div id="text"></div><span class="cursor"></span>

  <button onclick="showSurprise()">💌 Open Surprise</button>

  <div id="surprise">
    I love you ❤️  
    I miss you more than you think 🥺💖
  </div>
</div>

<audio id="bgm" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>

const message = `Hey…

I don’t say this enough.

But somewhere between
all the random conversations
and small moments…

you became my favorite person.

The one I think about
without even trying.

And honestly…

I just really miss you.`;


let i = 0;

function start(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("box").style.display="block";
  document.getElementById("bgm").volume = 0.2;
  document.getElementById("bgm").play();
  type();
  hearts();
}

function type(){
  if(i < message.length){
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(type, 50);
  }
}

function showSurprise(){
  document.getElementById("surprise").style.display="block";
}

/* Floating hearts */
function hearts(){
  setInterval(()=>{
    let h = document.createElement("div");
    h.className="heart";
    h.innerHTML="💗";
    h.style.left = Math.random()*100 + "vw";
    h.style.bottom = "0px";
    document.body.appendChild(h);

    setTimeout(()=>{ h.remove(); },5000);
  },700);
}

</script>

</body>
</html>
