<!DOCTYPE html>
<html>
<head>
<title>For You 🎟️</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff5f7;
  font-family: 'Georgia', serif;
}

/* Start Screen */
#startScreen {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff5f7;
  color:#d46a7e;
  font-size:22px;
  cursor:pointer;
}

/* Ticket */
.ticket {
  width:700px;
  max-width:90%;
  background:#fff;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.15);
  display:flex;
  overflow:hidden;
  border:2px dashed #f3c6cf;
}

/* Left side */
.left {
  flex:2;
  padding:25px;
  border-right:2px dashed #f3c6cf;
}

/* Right stub */
.right {
  flex:1;
  padding:20px;
  text-align:center;
  background:#ffe9ee;
}

/* Titles */
h1 {
  margin:0;
  font-size:28px;
  color:#d46a7e;
}

.subtitle {
  font-size:14px;
  color:#888;
  margin-bottom:15px;
}

/* Details */
.info {
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  font-size:14px;
}

/* Cute icons */
.emoji {
  font-size:18px;
}

/* Message box */
#text {
  margin-top:20px;
  font-size:16px;
  line-height:1.7;
  white-space:pre-line;
}

/* Cursor */
.cursor {
  display:inline-block;
  width:8px;
  background:#d46a7e;
  animation:blink 1s infinite;
}

@keyframes blink {
  50% { background:transparent; }
}

/* Button */
button {
  margin-top:20px;
  padding:10px 18px;
  border:none;
  background:#d46a7e;
  color:white;
  border-radius:20px;
  cursor:pointer;
}

/* Small floating hearts */
.heart {
  position:absolute;
  color:#ff9eb5;
  font-size:20px;
  animation:float 5s linear infinite;
}

@keyframes float {
  from { transform:translateY(0); opacity:1; }
  to { transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<div id="startScreen" onclick="start()">🎟️ Tap to open your ticket</div>

<div class="ticket" id="ticket" style="display:none;">

  <!-- LEFT -->
  <div class="left">
    <h1>💖 Movie Date Night</h1>
    <div class="subtitle">Good movies. Better company.</div>

    <div class="info">
      <div>📅 Tonight</div>
      <div>⏰ 9:30 PM</div>
    </div>

    <div class="info">
      <div>💻 Online</div>
      <div>🍿 Snacks ready</div>
    </div>

    <div id="text"></div><span class="cursor"></span>

    <button onclick="extra()">💌 Open Surprise</button>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h3>🎟️ Admit One</h3>
    <p style="margin-top:30px;">Movie Night</p>
    <p style="font-size:12px;">Let’s make memories ❤️</p>
  </div>

</div>

<audio id="bgm" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>

const message = `You’re not just someone I love.

You’re the person I want in
all the small, simple moments.

The random talks.
The stupid jokes.

And honestly?

I’d still choose you.
Every single time.`;

let i = 0;

function start(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("ticket").style.display="flex";
  document.getElementById("bgm").volume = 0.2;
  document.getElementById("bgm").play();
  type();
  hearts();
}

function type(){
  if(i < message.length){
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(type, 50);
  }
}

function extra(){
  document.getElementById("text").innerHTML += "\n\nStay with me. Always. ❤️";
}

/* Floating hearts */
function hearts(){
  setInterval(()=>{
    let h = document.createElement("div");
    h.className="heart";
    h.innerHTML="💗";
    h.style.left = Math.random()*100 + "vw";
    h.style.bottom = "0px";
    document.body.appendChild(h);

    setTimeout(()=>{ h.remove(); },5000);
  },800);
}

</script>

</body>
</html>
