<!DOCTYPE html>
<html>
<head>
<title>For You 💖</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff5f7;
  font-family:'Georgia', serif;
  overflow:hidden;
}

/* Start Screen */
#startScreen {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff5f7;
  color:#d46a7e;
  font-size:22px;
  cursor:pointer;
  letter-spacing:1px;
}

/* Box */
#box {
  background:#ffffff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  max-width:480px;
  width:85%;
  text-align:center;
  display:none;
  border:1px solid #f3d6db;
}

/* Small heading */
#title {
  font-size:16px;
  color:#d46a7e;
  margin-bottom:10px;
  letter-spacing:1px;
}

/* Text */
#text {
  font-size:16px;
  line-height:1.7;
  white-space:pre-line;
  color:#444;
}

/* Cursor */
.cursor {
  display:inline-block;
  width:8px;
  background:#d46a7e;
  animation:blink 1s infinite;
}

@keyframes blink {
  50% { background:transparent; }
}

/* Button */
button {
  margin-top:20px;
  padding:10px 20px;
  border:none;
  background:#d46a7e;
  color:white;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}

/* Audio */
audio {
  width:100%;
  margin-top:15px;
}
  
/* Surprise */
#surprise {
  margin-top:20px;
  font-size:18px;
  color:#c94f65;
  display:none;
}

/* Tiny floating hearts (subtle) */
.heart {
  position:absolute;
  color:#ffc0cb;
  font-size:14px;
  animation:float 6s linear infinite;
}

@keyframes float {
  from { transform:translateY(0); opacity:0.8; }
  to { transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<div id="startScreen" onclick="start()">💌 Tap to open</div>

<div id="box">
  <div id="title">just something for you❤️</div>

  <div id="text"></div><span class="cursor"></span>
<audio id="bgm" loop>
  <source src="Bairan - Bairan (320 kbps).mp3" type="audio/mpeg">
</audio>
  
  <button onclick="showSurprise()">open surprise 💖</button>
  
  <div id="surprise">
    I love you ❤️  
    I miss you more than you think 🥺
    <button onclick="reply()">did you smile? 😊</button>
  </div>
</div>

<script>

/* SIMPLE + CLEAR MESSAGE */
const message = `Hey gundanna

I just wanted to say.

You matter to me.

A lot more than I usually say.

And honestly…

I really miss you.`;


let i = 0;

function start(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("box").style.display="block";
 let music = document.getElementById("bgm");
  music.currentTime = 38;
  music.volume = 0.2;
  music.play(); // starts after tap

  type();
  hearts();
}

function type(){
  if(i < message.length){
    document.getElementById("text").innerHTML += message.charAt(i);
    i++;
    setTimeout(type, 55);
  }
}

function showSurprise(){
  document.getElementById("surprise").style.display="block";
}

/* Subtle hearts */
function hearts(){
  setInterval(()=>{
    let h = document.createElement("div");
    h.className="heart";
    h.innerHTML="💗";
    h.style.left = Math.random()*100 + "vw";
    h.style.bottom = "0px";
    document.body.appendChild(h);

    setTimeout(()=>{ h.remove(); },6000);
  },1200);
}

function reply(){
  document.getElementById("surprise").innerHTML += "\n\nThat means everything to me ❤️";
}
</script>

</body>
</html>
